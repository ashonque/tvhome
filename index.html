<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ====== EDIT HERE: colors ====== */
  :root {
    --bg: #12161f;
    --glow: rgba(176, 138, 72, 0.38);
    --text: #f3f1ec;
    --muted: #9aa0ab;
    --tile: rgba(255, 255, 255, 0.09);
    --tile-border: rgba(255, 255, 255, 0.2);
    --focus: #d8b766;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; color: var(--text);
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 55% 60% at 0% 0%, var(--glow), rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 80% 70% at 100% 100%, rgba(0,0,0,0.45), rgba(0,0,0,0) 70%),
      linear-gradient(160deg, #1b1f29 0%, #12161f 55%, #0c0f15 100%);
  }

  /* Header: greeting, clock + weather */
  #greeting { position: absolute; top: 5vh; left: 6.25vw; font-size: 4.2vh; color: var(--focus); }
  .clock { position: absolute; top: 11vh; left: 6.25vw; }
  #time { font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: 13vh; font-weight: 400; line-height: 0.9; letter-spacing: -0.02em; }
  #date { font-size: 2.9vh; color: var(--muted); margin-top: 1.6vh; }
  .weather { position: absolute; top: 14vh; right: 6.25vw; display: flex; align-items: center; }
  .weather svg { width: 8vh; height: 8vh; margin-right: 1.6vh; }
  #temp { font-size: 7.2vh; font-weight: 400; line-height: 1; }

  /* Tiles */
  .grid {
    position: absolute; top: 36vh; left: 6.25vw; right: 6.25vw;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 22.5vh 22.5vh;
    column-gap: 2.2vw; row-gap: 3.8vh;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--tile); border: 1px solid var(--tile-border); border-radius: 1.8vh;
    color: var(--text); text-decoration: none; outline: none;
    box-shadow: 0 1vh 3vh rgba(0, 0, 0, 0.35);
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .tile svg { width: 8.5vh; height: 8.5vh; }
  .tile .name { font-size: 2.9vh; margin-top: 1.8vh; }
  .tile.focus {
    transform: scale(1.06);
    background: rgba(232, 214, 170, 0.24);
    border: 2px solid var(--focus);
    box-shadow: 0 0 2.5vh rgba(216, 183, 102, 0.35), 0 1.5vh 4vh rgba(0, 0, 0, 0.45);
  }

  #hint {
    display: none; position: absolute; left: 50%; bottom: 12vh; width: 60vw; margin-left: -30vw;
    padding: 2vh; text-align: center; font-size: 3.2vh; border-radius: 1.5vh;
    background: rgba(0, 0, 0, 0.75); border: 2px solid var(--focus);
  }

  footer { position: absolute; bottom: 5.4vh; left: 0; right: 0; text-align: center; font-size: 2.2vh; color: var(--muted); }

  /* Line icons */
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div id="greeting"></div>

<div class="clock">
  <div id="time">--:--</div>
  <div id="date"></div>
</div>

<div class="weather">
  <span id="wicon"></span>
  <div id="temp">--°</div>
</div>

<!-- ====== EDIT HERE: your tiles (icon, name, link) ====== -->
<div class="grid" id="grid">
  <a class="tile" href="https://www.youtube.com/tv">
    <svg viewBox="0 0 48 48"><path fill="#FF0000" d="M45 14.4a5.6 5.6 0 0 0-4-4C37.6 9.5 24 9.5 24 9.5s-13.6 0-17 .9a5.6 5.6 0 0 0-4 4C2.1 17.8 2.1 24 2.1 24s0 6.2.9 9.6a5.6 5.6 0 0 0 4 4c3.4.9 17 .9 17 .9s13.6 0 17-.9a5.6 5.6 0 0 0 4-4c.9-3.4.9-9.6.9-9.6s0-6.2-.9-9.6z"/><path fill="#FFFFFF" d="M19.6 30.2L31 24l-11.4-6.2z"/></svg>
    <span class="name">YouTube</span></a>

  <a class="tile" href="https://www.ardmediathek.de">
    <svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="9" fill="#003480"/><text x="24" y="29.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">ARD</text></svg>
    <span class="name">ARD Mediathek</span></a>

  <a class="tile" href="https://www.zdf.de">
    <svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="9" fill="#FA7D19"/><text x="24" y="29.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">ZDF</text></svg>
    <span class="name">ZDF</span></a>

  <a class="tile" href="https://open.spotify.com">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#1ED760"/><g fill="none" stroke="#000000" stroke-linecap="round"><path d="M12.5 18.5C20 16 29 16.8 36 20.5" stroke-width="3.4"/><path d="M14 25C20.5 23 27.5 23.6 33.5 26.8" stroke-width="2.9"/><path d="M15.5 31C21 29.6 26.5 30 31 32.4" stroke-width="2.4"/></g></svg>
    <span class="name">Spotify</span></a>

  <a class="tile" href="https://www.tagesschau.de">
    <svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="9" fill="#0A3B78"/><text x="24" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7.6" fill="#FFFFFF">tagesschau</text></svg>
    <span class="name">Tagesschau</span></a>

  <a class="tile" href="https://claude.ai">
    <svg viewBox="0 0 48 48"><g stroke="#D97757" stroke-width="4" stroke-linecap="round"><path d="M24 6v36M6 24h36M11.3 11.3l25.4 25.4M36.7 11.3L11.3 36.7M17.1 7.4l13.8 33.2M30.9 7.4L17.1 40.6M7.4 17.1l33.2 13.8M40.6 17.1L7.4 30.9"/></g></svg>
    <span class="name">Claude</span></a>

  <a class="tile" href="https://www.google.com">
    <svg viewBox="0 0 48 48"><g fill="none" stroke-width="7"><path d="M38 24A14 14 0 0 1 33.9 33.9M24 24H38" stroke="#4285F4"/><path d="M33.9 33.9A14 14 0 0 1 11.88 31" stroke="#34A853"/><path d="M11.88 31A14 14 0 0 1 11.88 17" stroke="#FBBC05"/><path d="M11.88 17A14 14 0 0 1 34.72 15" stroke="#EA4335"/></g></svg>
    <span class="name">Google</span></a>

  <a class="tile" id="vidaa" href="#">
    <svg viewBox="0 0 48 48"><g fill="none" stroke="#d8b766" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 23L24 8l17 15"/><path d="M12 19v20h24V19"/><path d="M20 39V28h8v11"/></g></svg>
    <span class="name">VIDAA Home</span></a>
</div>

<div id="hint">Press the Home button on your remote</div>

<footer>OK öffnen &nbsp;·&nbsp; ◀ ▶ navigieren</footer>

<script>
  // ====== EDIT HERE: weather location (Mörfelden-Walldorf) ======
  var LAT = 49.99, LON = 8.57;
  var COLS = 4; // must match grid-template-columns

  // ====== EDIT HERE: names in the greeting ======
  var NAMES = "Ashwin & Cinzia";

  // --- Clock + greeting ---
  function greetingFor(h) {
    if (h >= 5 && h < 12) return "Good morning";
    if (h >= 12 && h < 18) return "Good afternoon";
    if (h >= 18 && h < 22) return "Good evening";
    return "Good night";
  }
  var DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function tick() {
    var d = new Date();
    document.getElementById("greeting").textContent = greetingFor(d.getHours()) + ", " + NAMES;
    document.getElementById("time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    document.getElementById("date").textContent = DAYS[d.getDay()] + ", " + d.getDate() + ". " + MONTHS[d.getMonth()];
  }
  tick(); setInterval(tick, 10000);

  // --- Weather icons (line style) ---
  var S = '<svg class="ic" viewBox="0 0 48 48">';
  var CLOUD = '<path d="M14 36h21a8 8 0 0 0 0-16 11 11 0 0 0-21-2A9 9 0 0 0 14 36z"/>';
  var ICONS = {
    sun:   S + '<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M36.7 11.3l-3.5 3.5M14.8 33.2l-3.5 3.5"/></svg>',
    cloud: S + CLOUD + '</svg>',
    rain:  S + '<path d="M14 30h21a8 8 0 0 0 0-16 11 11 0 0 0-21-2A9 9 0 0 0 14 30z"/><path d="M17 35l-2 5M25 35l-2 5M33 35l-2 5"/></svg>',
    snow:  S + '<path d="M14 30h21a8 8 0 0 0 0-16 11 11 0 0 0-21-2A9 9 0 0 0 14 30z"/><path d="M17 37v.1M25 39v.1M33 37v.1" stroke-width="3"/></svg>',
    fog:   S + '<path d="M8 18h32M6 25h36M10 32h28"/></svg>',
    storm: S + '<path d="M14 30h21a8 8 0 0 0 0-16 11 11 0 0 0-21-2A9 9 0 0 0 14 30z"/><path d="M25 31l-4 7h6l-4 7"/></svg>'
  };
  function iconFor(code) {
    if (code <= 1) return ICONS.sun;
    if (code <= 3) return ICONS.cloud;
    if (code === 45 || code === 48) return ICONS.fog;
    if (code >= 71 && code <= 77) return ICONS.snow;
    if (code >= 95) return ICONS.storm;
    return ICONS.rain;
  }
  document.getElementById("wicon").innerHTML = ICONS.cloud;

  // --- Weather data (Open-Meteo, free, no key) ---
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
              "&current=temperature_2m,weather_code&timezone=Europe%2FBerlin";
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.onload = function () {
      try {
        var c = JSON.parse(x.responseText).current;
        document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
        document.getElementById("wicon").innerHTML = iconFor(c.weather_code);
      } catch (e) {}
    };
    x.send();
  }
  loadWeather(); setInterval(loadWeather, 30 * 60 * 1000);

  // --- Remote control navigation ---
  var tiles = document.getElementById("grid").getElementsByTagName("a");
  var current = 0;
  try { current = parseInt(localStorage.getItem("tvhome_focus") || "0", 10) || 0; } catch (e) {}
  if (current >= tiles.length) current = 0;

  function setFocus(i) {
    if (i < 0 || i >= tiles.length) return;
    tiles[current].className = "tile";
    current = i;
    tiles[current].className = "tile focus";
    tiles[current].focus();
    try { localStorage.setItem("tvhome_focus", current); } catch (e) {}
  }
  setFocus(current);

  // "VIDAA Home" tile: close this page so the TV falls back to the VIDAA home screen.
  // If the TV doesn't allow closing, show a hint instead.
  function goVidaaHome() {
    try { window.close(); } catch (e) {}
    setTimeout(function () {
      var h = document.getElementById("hint");
      h.style.display = "block";
      setTimeout(function () { h.style.display = "none"; }, 4000);
    }, 700);
  }

  function openTile(i) {
    if (tiles[i].id === "vidaa") { goVidaaHome(); }
    else { window.location.href = tiles[i].href; }
  }

  for (var t = 0; t < tiles.length; t++) {
    (function (i) {
      tiles[i].onmouseover = function () { setFocus(i); };
      tiles[i].onclick = function () { setFocus(i); openTile(i); return false; };
    })(t);
  }

  document.onkeydown = function (e) {
    var k = e.keyCode;
    if (k === 37) { setFocus(current - 1); }            // left
    else if (k === 39) { setFocus(current + 1); }       // right
    else if (k === 38) {                                 // up
      if (current < COLS) { tiles[current].blur(); return true; } // top row: let the browser bar take over
      setFocus(current - COLS);
    }
    else if (k === 40) {                                 // down
      var n = current + COLS;
      if (n >= tiles.length && current < COLS) n = tiles.length - 1; // no tile below: go to last
      setFocus(n);
    }
    else if (k === 13) { openTile(current); }            // OK
    else { return true; }
    if (e.preventDefault) e.preventDefault();
    return false;
  };
</script>
</body>
</html>
